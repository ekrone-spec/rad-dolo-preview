backend:
  name: git-gateway
  branch: main
  commit_messages:
    create: "CMS: add {{collection}} — {{slug}}"
    update: "CMS: update {{collection}} — {{slug}}"
    delete: "CMS: delete {{collection}} — {{slug}}"
    uploadMedia: "CMS: upload {{path}}"

site_url: https://www.raddolo.com
logo_url: /favicon.svg

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: journal
    label: "Journal"
    label_singular: "Journal note"
    folder: "content/journal"
    create: true
    slug: "{{slug}}"
    description: "Notes on the journal. Publishing rebuilds the site and adds the note to the email feed. House rule: no hyphens or dashes in the text."
    fields:
      - { name: title, label: Title, widget: string, hint: "No hyphens or dashes." }
      - { name: date, label: "Publish date", widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - name: category
        label: Category
        widget: select
        options: ["Closet edit", "Wardrobe", "Shopping", "Packing", "Men's styling", "Events", "The journal"]
        default: "Wardrobe"
      - { name: minutes, label: "Minutes to read", widget: number, default: 2, value_type: int, min: 1, max: 15 }
      - { name: description, label: "One line teaser", widget: text, hint: "Shows on the homepage card, in search results and in the email." }
      - { name: image, label: "Feature photo", widget: image, required: false, hint: "Landscape works best (3:2)." }
      - { name: body, label: "The note", widget: markdown, hint: "The first paragraph becomes the large opening line." }

  - name: services
    label: "Service pages"
    label_singular: "Service page"
    folder: "content/services"
    create: true
    slug: "{{slug}}"
    description: "The detail pages behind the service list on the homepage. The file name becomes the web address, so raddolo.com/services/closet-edits/. House rule: no hyphens or dashes in the text."
    fields:
      - { name: title, label: "Service name", widget: string, hint: "Shows as the page heading. Keep it short." }
      - { name: order, label: "Order", widget: number, default: 1, value_type: int, min: 1, max: 20, hint: "Controls the order these appear in the 'also from the work' list." }
      - { name: seo_title, label: "Search engine title", widget: string, hint: "What Google shows as the blue link. Include Minneapolis where it fits naturally." }
      - { name: description, label: "Search engine description", widget: text, hint: "The grey text under the Google link. Two sentences, written for a person deciding whether to click." }
      - { name: lead, label: "Opening line", widget: text, hint: "The large line under the heading. One or two sentences." }
      - { name: image, label: "Feature photo", widget: image, required: false, hint: "Landscape works best (3:2)." }
      - { name: body, label: "The page", widget: markdown, hint: "Use Heading 2 for section titles. To get a questions section, add a Heading 2 called 'Common questions' and put each question in a Heading 3 with the answer underneath. Those questions are what Google and AI assistants quote." }

  - name: pages
    label: "Homepage sections"
    files:
      - name: services_list
        label: "Service list (homepage)"
        file: "content/services.json"
        description: "The numbered list of services on the homepage. Leave the page field empty for a service that has no detail page yet."
        fields:
          - name: items
            label: "Services"
            widget: list
            fields:
              - { name: name, label: "Service name", widget: string }
              - { name: desc, label: "One line description", widget: string }
              - { name: page, label: "Detail page address", widget: string, required: false, hint: "Must match a service page file name exactly, for example closet-edits. Leave empty for no link." }

      - name: shop
        label: "Shop my picks"
        file: "content/shop.json"
        description: "The three shop cards. Paste a ShopMy link and the photo is pulled automatically; only add a photo if you want to override it."
        fields:
          - name: items
            label: "Shop features"
            widget: list
            fields:
              - { name: title, label: Title, widget: string }
              - { name: url, label: "ShopMy link", widget: string }
              - { name: image, label: "Photo (optional override)", widget: image, required: false }

      - name: publications
        label: "As featured in"
        file: "content/publications.json"
        description: "Publication logos in the scrolling row. Add a logo and the article link."
        fields:
          - name: items
            label: "Publications"
            widget: list
            fields:
              - { name: name, label: "Publication name", widget: string }
              - { name: url, label: "Article link", widget: string }
              - { name: logo, label: "Logo", widget: image, hint: "Crop tight to the logo. Transparent PNG looks best." }

      - name: quotes
        label: "Client quotes"
        file: "content/quotes.json"
        description: "The rotating one line quotes at the top of the homepage. Keep them short."
        fields:
          - name: items
            label: "Quotes"
            widget: list
            field: { name: quote, label: Quote, widget: string }

<style>

  p{max-width:44ch;color:#444444;margin:1.4rem 0 2.2rem;font-size:1.05rem;line-height:1.6}
  .btn{display:inline-flex;align-items:center;gap:.5rem;font-family:var(--label);font-size:.76rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);text-decoration:none;border:1.5px solid var(--ink);padding:.9rem 1.5rem;transition:background .2s,color .2s}
  .btn:hover{background:var(--ink);color:var(--paper)}
  footer{border-top:1px solid var(--hair);padding:1.6rem clamp(1.2rem,4vw,3rem);font-size:.78rem;color:var(--muted);text-align:center}
  footer a{text-decoration:underline;text-underline-offset:3px}
